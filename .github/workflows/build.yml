name: Build Ghostie APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Ghostie project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q GhostieAndroid_OnlineBuildReady.zip -d extracted

          echo "Android project contents:"
          find extracted -maxdepth 3 -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure JVM compatibility
        run: |
          cat >> extracted/app/build.gradle << 'EOF'

          // Align Java and Kotlin JVM targets
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
      - name: Build Ghostie APK
        working-directory: extracted
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find extracted -type f -name "*.apk" -print

      - name: Upload Ghostie APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghostie-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
